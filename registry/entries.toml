namespace = "model"
value = 10000.0
unit = "minor-unit/hour"
scope = "world"
owner = "reservation-mint"
provenance = "derived"
expression = "world.numeraire / world.total_hours"
justification = "The unit a period-0 labour reservation is quoted in. It sets the unit, never the level; the price is whatever crosses."

