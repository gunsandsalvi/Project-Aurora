# The parameter registry (§16.1). Every number the model opens with is an entry here, and the build
# refuses one that is not.
#
# Two namespaces (ADR-0014). `model` entries are claims about the world and their count is the honest
# measure of how much of it was chosen rather than produced (M3). `capacity` entries are engineering
# sizes: they answer no question about the economy, they are counted separately, and no agent,
# valuation or economic system may read one.
#
# THIS IS A DRAFT CENSUS, not the seed. It holds what is identifiable today, which is enough to
# exercise every rule and to publish a count before the count can be embarrassing.

# ─────────────────────────── structural: definitional arithmetic ───────────────────────────

[[entry]]
name = "world.region_count"
namespace = "model"
value = 4.0
unit = "count"
scope = "world"
owner = "seed"
provenance = "structural"
identity = "RegionCount"
justification = "The world is four regions; a fifth reopens A4 and is an ADR before it is anything else."

