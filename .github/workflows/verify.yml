# The gate. Rule: mid-milestone these are the only things that run, they are seconds, and they are
# green before every commit. A budget is published because a gate nobody can afford stops being run.
#
# This runs gate.sh and nothing else, so what CI checks and what a developer runs before committing
# are the same file. The failure this prevents is real: on 2026-09-06 a commit shipped with a clippy
# finding because `verify` was green and clippy was a separate habit.
name: verify

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  AURORA_GATE_LOCKED: --locked

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # the published budget; a gate that grows past it is a defect, not a wait
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Gate
        run: ./gate.sh
